<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
<style>body{margin:0;background:#f4f3f1;color:#333;font-family:sans-serif;padding:36px;width:1100px}
.row{display:flex;align-items:center;gap:30px;margin:0 0 26px}.lab{width:150px;font-size:13px;color:#666}
.m{font:400 78px 'Marcellus',serif;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.dark{background:#252525;padding:26px 30px;border-radius:5px;display:flex;gap:40px;align-items:center}</style></head><body>
<div class="row"><div class="lab">Marcellus biasa</div><div class="m">Quotient</div></div>
<div class="row"><div class="lab">Marcellus ditebalkan paksa</div><div class="m" style="-webkit-text-stroke:3px #333">Quotient</div></div>
<div class="row"><div class="lab">Geometris, tebal 20</div><img src="quotient-wordmark-w20.svg" height="100"></div>
<div class="row"><div class="lab">Geometris, tebal 24</div><img src="quotient-wordmark-w24.svg" height="100"></div>
<div class="row"><div class="lab">Ukuran kepala halaman</div><img src="quotient-wordmark-w24.svg" height="30"><img src="quotient-wordmark-w24.svg" height="20"><img src="quotient-wordmark-w20.svg" height="20"></div>
<div class="dark"><img src="../final/variants/quotient-symbol-white.svg" height="70"><span style="color:#f4f3f1;font:400 15px sans-serif">putih di latar gelap diperlukan nanti</span></div>
</body></html>
