# One origin for the browser: the built frontend, and /api forwarded to the API
# with the prefix stripped, so the API needs no CORS.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SSE: sent the moment the API writes it, and kept open well past the 15 s heartbeat.
  location ~ ^/api/(events/stream|organizer/events/[^/]+/stream)$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # nginx has no mime type for .webmanifest, and browsers want a manifest type.
  location = /site.webmanifest {
    default_type application/manifest+json;
  }

  # Hashed build files never change, so they can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/masuk, /organizer, ...) all load index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
