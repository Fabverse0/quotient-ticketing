services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quotient}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quotient}
      POSTGRES_DB: ${POSTGRES_DB:-quotient}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-quotient}:${POSTGRES_PASSWORD:-quotient}@postgres:5432/${POSTGRES_DB:-quotient}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-any-real-use}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      QUOTA_STRATEGY: ${QUOTA_STRATEGY:-atomic}
      NAIVE_RACE_DELAY_MS: ${NAIVE_RACE_DELAY_MS:-0}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-only-webhook-secret-change-before-real-use}
      SWEEPER_ENABLED: ${SWEEPER_ENABLED:-true}
      SWEEPER_INTERVAL_MS: ${SWEEPER_INTERVAL_MS:-30000}
      ORGANIZER_EMAIL: ${ORGANIZER_EMAIL:-organizer@quotient.local}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:-organizer-demo-pass}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
