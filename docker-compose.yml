services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quotient}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quotient}
      POSTGRES_DB: ${POSTGRES_DB:-quotient}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-quotient}:${POSTGRES_PASSWORD:-quotient}@postgres:5432/${POSTGRES_DB:-quotient}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-any-real-use}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      QUOTA_STRATEGY: ${QUOTA_STRATEGY:-atomic}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-only-webhook-secret-change-before-real-use}
      ORGANIZER_EMAIL: ${ORGANIZER_EMAIL:-}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:-}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
